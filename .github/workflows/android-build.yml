name: Android CI - Build debug APK

on: push: branches: [ main, master ] pull_request: branches: [ main, master ] workflow_dispatch:

jobs: build: name: Build debug APK runs-on: ubuntu-latest env: JAVA_HOME: /opt/hostedtoolcache/jdk/11.0.19/x64

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up JDK 11
    uses: actions/setup-java@v4
    with:
      java-version: '11'
      distribution: 'temurin'

  - name: Grant execute permission for gradlew
    run: chmod +x ./gradlew

  - name: Cache Gradle
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
      restore-keys: |
        ${{ runner.os }}-gradle-

  - name: Install Android SDK (platform & build-tools)
    uses: android-actions/setup-android@v2
    with:
      api-level: 36
      build-tools: "36.0.0"
      ndk: "21.4.7075529" # optional; remove if not needed

  - name: Build debug APK
    run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: vibecoder-app-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
